{% load ui %}{# Port of the CreatorCard component in src/main.jsx. #}
<article class="panel creator"><div class="avatar" style="background: {{ creator.avatar_colour }}">{{ creator.initials }}</div><h2>{{ creator.name }}</h2><p>{{ creator.role }} &middot; {{ creator.city }}</p><div class="tags">{% for genre in creator.genres %}<span class="pill">{{ genre }}</span>{% endfor %}</div><p>{{ creator.bio }}</p><div class="actions"><a href="/creators/{{ creator.external_id }}">View profile &#8599;</a><form method="post" action="/discover/save/{{ creator.external_id }}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"/><button aria-pressed="{% if creator.saved %}true{% else %}false{% endif %}">{% if creator.saved %}Saved &#10003;{% else %}Save creator +{% endif %}</button></form></div></article>
