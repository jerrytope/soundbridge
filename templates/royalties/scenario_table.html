<div class="table-scroll" tabindex="0" role="region" aria-label="Royalty results"><table><caption>Gross revenue, deductions and estimated ownership share</caption><thead><tr><th>Scenario</th><th>Gross</th><th>Deductions</th><th>Share before tax</th><th>Entered tax</th><th>Estimated share</th></tr></thead><tbody>{% for label, row in scenarios.items %}<tr><th>{{ label|title }}</th><td>{{ row.gross }}</td><td>{{ row.deductions }}</td><td>{{ row.user_share_before_tax }}</td><td>{{ row.tax }}</td><td>{{ row.amount }}</td></tr>{% endfor %}</tbody></table></div>
